name: Build and deploy docs.philterd.ai

on:
  # Nightly, so a product release published during the day is live the next morning
  # without any per-repo wiring. Dispatch manually to pick it up sooner.
  #
  # Note that GitHub disables a repository's scheduled workflows after 60 days with
  # no commits. If this repo goes quiet, check that the schedule is still enabled.
  schedule:
    - cron: '0 18 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/configure-pages@v6

      # Restoring the previous site/ makes the build incremental: only release tags
      # not already published get rebuilt. A cache miss is not a failure, it just
      # means a full rebuild of every version.
      - name: Restore previous build
        uses: actions/cache@v6
        with:
          path: |
            site
            .build-manifest.json
          key: docs-site-${{ github.run_id }}
          restore-keys: docs-site-

      - name: Build
        run: ./build.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
