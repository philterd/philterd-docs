# What docs.philterd.ai publishes. See README.md for the reasoning.
#
#   versions: latest   newest release tag, at /<path>/
#   versions: all      every tag >= min_version, at /<path>/<version>/,
#                      newest also at /<path>/latest/
#   dev: true          also build the default branch at /<path>/dev/, noindex
#   min_version        earliest tag to publish

site_url: https://docs.philterd.ai

products:
  - name: Philter
    repo: philter
    path: philter
    summary: Self-hosted PII and PHI redaction API.
    versions: all
    min_version: "2.7.0"
    dev: true

  - name: Phileas
    repo: phileas
    path: phileas
    summary: The redaction library underneath Philter. Java, Python, and .NET.
    versions: latest
    dev: true
